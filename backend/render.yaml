services:
  - type: web
    name: smt-backend
    env: node
    region: singapore
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smt-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000
      - key: CLOUDINARY_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RECURRENCE_WINDOW_DAYS
        value: "30"

databases:
  - name: smt-db
    region: singapore
    plan: free
